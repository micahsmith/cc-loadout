name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: skald-x86_64-unknown-linux-gnu
          - os: macos-latest
            asset: skald-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Check that the binary runs alone
        run: |
          env -i PATH=/usr/bin:/bin target/release/skald --version
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L target/release/skald
          else
            ldd target/release/skald
          fi
      - name: Upload the binary
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          cp target/release/skald "$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
